openapi: 3.1.0
info:
  title: Iris inference API
  version: 1.0.0
paths:
  /health/live:
    get:
      operationId: healthLive
      responses:
        "200":
          description: Process is alive
  /health/ready:
    get:
      operationId: healthReady
      responses:
        "200":
          description: Immutable model version is loaded
        "503":
          description: Model is not loaded
  /v1/models/iris:predict:
    post:
      operationId: predictIrisV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictRequest"
      responses:
        "200":
          description: Prediction completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictResponse"
        "422":
          description: Request validation failed
        "503":
          description: Model is unavailable
components:
  schemas:
    IrisFeatures:
      type: object
      additionalProperties: false
      required: [sepal_length, sepal_width, petal_length, petal_width]
      properties:
        sepal_length: {type: number, exclusiveMinimum: 0, maximum: 10}
        sepal_width: {type: number, exclusiveMinimum: 0, maximum: 10}
        petal_length: {type: number, exclusiveMinimum: 0, maximum: 10}
        petal_width: {type: number, exclusiveMinimum: 0, maximum: 10}
    PredictRequest:
      type: object
      additionalProperties: false
      required: [instances]
      properties:
        instances:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/IrisFeatures"
    PredictResponse:
      type: object
      additionalProperties: false
      required: [model_uri, model_version, predictions]
      properties:
        model_uri: {type: string}
        model_version: {type: string, minLength: 1}
        predictions:
          type: array
          items:
            type: string
            enum: [setosa, versicolor, virginica]
