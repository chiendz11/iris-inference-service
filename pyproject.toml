[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-inference-service"
version = "0.1.0"
description = "FastAPI/KServe-compatible API loading a champion model from MLflow"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "mlflow>=3.5,<4",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
  "prometheus-client>=0.21,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

