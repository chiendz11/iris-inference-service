apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: iris
  namespace: iris-serving
  annotations:
    serving.kserve.io/deploymentMode: Serverless
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 3
    containers:
      - name: kserve-container
        image: ghcr.io/REPLACE_ME/iris-inference:latest
        ports:
          - containerPort: 8080
            protocol: TCP
        env:
          - name: MLFLOW_TRACKING_URI
            value: http://mlflow.model-registry.svc.cluster.local:5000
          - name: MODEL_URI
            value: models:/iris-classifier@champion
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /v2/health/ready
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /v2/health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10

