name: inference-service-ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -e .
      - run: ruff check app tests
      - run: python -m pytest -q
      - run: docker build -t iris-inference:${{ github.sha }} .

  ci-gate:
    name: ci-gate
    if: always()
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Require validation to pass
        env:
          TEST_AND_BUILD_RESULT: ${{ needs.test-and-build.result }}
        run: test "${TEST_AND_BUILD_RESULT}" = success

  publish-and-propose:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.INFERENCE_ECR_REPOSITORY }}
      GITOPS_REPOSITORY: ${{ vars.GITOPS_REPOSITORY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -t iris-inference:${{ github.sha }} .
      - name: Assume AWS deploy role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - name: Push immutable image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${{ github.sha }}"
          docker tag iris-inference:${{ github.sha }} "${IMAGE}"
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
      - name: Mint short-lived GitOps pull-request token
        id: gitops-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: iris-gitops
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout production desired state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          token: ${{ steps.gitops-token.outputs.token }}
          persist-credentials: false
          path: gitops
      - name: Open GitOps deployment pull request
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
        run: |
          cd gitops
          BRANCH="deploy/inference-${{ github.sha }}-${{ github.run_attempt }}"
          git checkout -b "${BRANCH}"
          sed -i -E "s|image: .*|image: ${IMAGE}|" environments/production/inference-service/inferenceservice.yaml
          git config user.name "iris-mlops-bot"
          git config user.email "iris-mlops-bot@users.noreply.github.com"
          git add -- environments/production/inference-service/inferenceservice.yaml
          git commit -m "deploy(inference): ${{ github.sha }}"
          gh auth setup-git
          git push origin "${BRANCH}"
          gh pr create --repo "${GITOPS_REPOSITORY}" --base main --head "${BRANCH}" \
            --title "deploy(inference): ${{ github.sha }}" \
            --body "Promote inference image built from ${{ github.repository }}@${{ github.sha }}."
