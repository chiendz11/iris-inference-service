name: inference-service-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -e .
      - run: ruff check app tests
      - run: python -m pytest -q
      - run: docker build -t iris-inference:${{ github.sha }} .

  publish-and-propose:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.INFERENCE_ECR_REPOSITORY }}
      GITOPS_REPOSITORY: ${{ vars.GITOPS_REPOSITORY }}
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t iris-inference:${{ github.sha }} .
      - name: Assume AWS deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push immutable image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${{ github.sha }}"
          docker tag iris-inference:${{ github.sha }} "${IMAGE}"
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
      - name: Checkout production desired state
        uses: actions/checkout@v6
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Open GitOps deployment pull request
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          cd gitops
          BRANCH="deploy/inference-${{ github.sha }}-${{ github.run_attempt }}"
          git checkout -b "${BRANCH}"
          sed -i -E "s|image: .*|image: ${IMAGE}|" environments/production/inference-service/inferenceservice.yaml
          git config user.name "iris-mlops-bot"
          git config user.email "iris-mlops-bot@users.noreply.github.com"
          git add -- environments/production/inference-service/inferenceservice.yaml
          git commit -m "deploy(inference): ${{ github.sha }}"
          git push origin "${BRANCH}"
          gh pr create --repo "${GITOPS_REPOSITORY}" --base main --head "${BRANCH}" \
            --title "deploy(inference): ${{ github.sha }}" \
            --body "Promote inference image built from ${{ github.repository }}@${{ github.sha }}."
